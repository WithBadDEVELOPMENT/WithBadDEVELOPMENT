<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FNASR</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #game-screen {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #080808;
        }

        /* Main Viewport Image (Office, Cameras, Jumpscare, Title) */
        #viewport {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* CRT Static & Scanlines Effect */
        #static-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.25),
                rgba(0, 0, 0, 0.25) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 10;
        }

        /* HUD Elements */
        #hud {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
            display: none;
        }

        .top-right {
            position: absolute;
            top: 25px;
            right: 35px;
            text-align: right;
            text-shadow: 2px 2px #000;
        }

        #clock { font-size: 2.5rem; font-weight: bold; }
        #night-display { font-size: 1.2rem; color: #aaa; }

        .bottom-left {
            position: absolute;
            bottom: 30px;
            left: 35px;
            text-shadow: 2px 2px #000;
        }

        #power-display { font-size: 1.5rem; font-weight: bold; }
        #usage-bars { display: inline-block; margin-left: 10px; }
        .bar {
            display: inline-block;
            width: 12px;
            height: 22px;
            background: #222;
            margin-right: 3px;
            border: 1px solid #555;
        }
        .bar.active-green { background: #0f0; }
        .bar.active-yellow { background: #ff0; }
        .bar.active-red { background: #f00; }

        /* Office Door & Light Controls */
        .door-controls {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: auto;
        }

        #left-controls { left: 25px; }
        #right-controls { right: 25px; }

        .fnaf-btn {
            width: 75px;
            height: 60px;
            background: #222;
            border: 3px solid #555;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: 0 0 10px #000;
        }
        .fnaf-btn:active { transform: scale(0.95); }
        .btn-door.on { background: #a00; border-color: #f55; }
        .btn-light.on { background: #aa0; border-color: #ff5; color: #000; }

        /* Camera Flip Bar */
        #cam-toggle {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 450px;
            height: 45px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid #fff;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
            pointer-events: auto;
            transition: background 0.2s;
        }
        #cam-toggle:hover { background: rgba(255, 255, 255, 0.35); }

        /* Camera Map Panel */
        #cam-map {
            position: absolute;
            bottom: 85px;
            right: 40px;
            width: 320px;
            height: 240px;
            background: rgba(0, 15, 0, 0.8);
            border: 2px solid #0f0;
            padding: 15px;
            display: none;
            pointer-events: auto;
        }

        #cam-label {
            color: #0f0;
            font-size: 1.2rem;
            margin-bottom: 10px;
            border-bottom: 1px solid #0f0;
            padding-bottom: 5px;
        }

        .cam-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .cam-btn {
            background: #111;
            border: 2px solid #666;
            color: #fff;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .cam-btn.selected {
            background: #3a5a1c;
            border-color: #9f0;
        }

        /* Title & End Screens */
        #overlay-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding-left: 80px;
        }

        #game-title {
            font-size: 4rem;
            line-height: 1.1;
            margin-bottom: 40px;
            text-shadow: 3px 3px #500;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            margin: 10px 0;
            text-align: left;
        }
        .menu-btn:hover { color: #f00; }
        .menu-btn:hover::before { content: ">> "; }

        /* Fallback missing image indicator */
        #missing-img-notice {
            position: absolute;
            top: 20px; left: 20px;
            background: rgba(150, 0, 0, 0.8);
            padding: 8px 12px;
            font-size: 0.9rem;
            z-index: 5;
            display: none;
        }
    </style>
</head>
<body>

<div id="game-screen">
    <!-- Main Dynamic Image -->
    <img id="viewport" src="SOURCES/title.png" alt="Game Viewport">
    <div id="missing-img-notice"></div>
    <div id="static-overlay"></div>

    <!-- Main Menu / Game Over / 6 AM Screen -->
    <div id="overlay-screen">
        <h1 id="game-title">FIVE NIGHTS<br>AT<br>SR</h1>
        <button class="menu-btn" id="start-btn">New Game</button>
        <p id="status-msg" style="margin-top: 20px; color: #aaa; font-size: 1.2rem;"></p>
    </div>

    <!-- In-Game HUD -->
    <div id="hud">
        <div class="top-right">
            <div id="clock">12 AM</div>
            <div id="night-display">Night 1</div>
        </div>

        <div class="bottom-left">
            <div id="power-display">Power left: <span id="power-val">100</span>%</div>
            <div style="margin-top: 5px;">
                Usage: 
                <div id="usage-bars">
                    <div class="bar active-green" id="bar-1"></div>
                    <div class="bar" id="bar-2"></div>
                    <div class="bar" id="bar-3"></div>
                    <div class="bar" id="bar-4"></div>
                </div>
            </div>
        </div>

        <!-- Left Door / Light -->
        <div class="door-controls" id="left-controls">
            <button class="fnaf-btn btn-door" id="left-door-btn">DOOR</button>
            <button class="fnaf-btn btn-light" id="left-light-btn">LIGHT</button>
        </div>

        <!-- Right Door / Light -->
        <div class="door-controls" id="right-controls">
            <button class="fnaf-btn btn-door" id="right-door-btn">DOOR</button>
            <button class="fnaf-btn btn-light" id="right-light-btn">LIGHT</button>
        </div>

        <!-- Camera Map -->
        <div id="cam-map">
            <div id="cam-label">CAM 1A - Show Stage</div>
            <div class="cam-grid">
                <button class="cam-btn selected" data-cam="CAM_1A">CAM 1A<br><small>Stage</small></button>
                <button class="cam-btn" data-cam="CAM_1B">CAM 1B<br><small>Dining</small></button>
                <button class="cam-btn" data-cam="CAM_2A">CAM 2A<br><small>W. Hall</small></button>
                <button class="cam-btn" data-cam="CAM_4A">CAM 4A<br><small>E. Hall</small></button>
            </div>
        </div>

        <!-- Monitor Flip Button -->
        <button id="cam-toggle">=== MONITOR ===</button>
    </div>
</div>

<!-- Loads your script directly from the SOURCES folder -->
<script src="SOURCES/MainScript.js"></script>
</body>
</html>
